[project]
name = "behavioral-model-testing-with-hf"
version = "0.1.0"
description = "Behavioral testing for sentiment analysis models using Hugging Face"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "utility: marks tests for utility functions (deselect with '-m \"not utility\"')",
]
